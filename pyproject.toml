[project]
name = "metadata-extractor2pln"
version = "0.1.0"
description = "Schema-adaptive metadata extraction and PeTTaChainer fact compilation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42,<2",
    "fastapi>=0.115,<1",
    "gunicorn>=23,<27",
    "httpx>=0.28.1",
    "pydantic>=2.10,<3",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "sexpdata>=1.0,<2",
]

[project.scripts]
metadata-extractor2pln = "metadata_extractor2pln.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_extractor2pln"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
